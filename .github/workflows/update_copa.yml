name: Update Copa Data

on:
  schedule:
    - cron: '*/5 * * * *' # Executa a cada 5 minutos
  workflow_dispatch: # Permite execução manual pelo painel de Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch World Cup data
        run: |
          curl -s -f "https://worldcup26.ir/get/games" -o copa_data.json || echo "Erro ao buscar dados da API"

      - name: Commit and push if changed
        run: |
          git config --global user.name "Copa Auto-Updater"
          git config --global user.email "copa-updater@github.com"
          git add copa_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update copa data [skip ci]" && git push)
