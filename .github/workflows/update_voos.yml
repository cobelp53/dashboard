name: Update SITAER Flights Data (P-53)

on:
  schedule:
    - cron: '*/5 * * * *' # Executa automaticamente na nuvem a cada 5 minutos
  workflow_dispatch: # Permite execução manual pelo painel do GitHub Actions ou pelo Admin COBEL
  push:
    paths:
      - '.github/scripts/fetch_voos.py'
      - '.github/scripts/fetch_brasileirao.py'
      - '.github/workflows/update_voos.yml'

permissions:
  contents: write

jobs:
  update-voos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome TLS impersonation (curl_cffi)
        run: |
          pip install --quiet curl_cffi || true

      - name: Fetch SITAER P-53 Flights & Brasileirao Data
        run: |
          python3 .github/scripts/fetch_voos.py || true
          python3 .github/scripts/fetch_brasileirao.py || true

      - name: Commit and push if changed
        run: |
          git config --global user.name "SITAER Auto-Updater"
          git config --global user.email "sitaer-updater@github.com"
          git add voos_data.json brasileirao_data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update P-53 SITAER flights and Brasileirao data"
            git pull --rebase origin main || true
            git push
          fi
