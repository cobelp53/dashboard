name: Update SITAER Flights Data (P-53)

on:
  schedule:
    - cron: '*/5 * * * *' # Executa a cada 5 minutos (máxima frequência permitida pelo GitHub Actions)
  workflow_dispatch: # Permite execução manual pelo painel do GitHub Actions ou pelo Admin COBEL
  push:
    paths:
      - '.github/scripts/fetch_voos.py'
      - '.github/workflows/update_voos.yml'

permissions:
  contents: write

jobs:
  update-voos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch SITAER P-53 Flights
        run: |
          python3 .github/scripts/fetch_voos.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "SITAER Auto-Updater"
          git config --global user.email "sitaer-updater@github.com"
          git add voos_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update P-53 SITAER flights data [skip ci]" && git push)
