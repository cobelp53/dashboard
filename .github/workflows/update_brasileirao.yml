name: Update Brasileirao Data

on:
  schedule:
    - cron: '*/15 * * * *' # Executa a cada 15 minutos
  workflow_dispatch: # Permite execução manual pelo painel do GitHub Actions
  push:
    paths:
      - '.github/scripts/fetch_brasileirao.py'
      - '.github/workflows/update_brasileirao.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome TLS impersonation (curl_cffi)
        run: |
          pip install --quiet curl_cffi || true

      - name: Fetch Brasileirao & SITAER Data
        run: |
          python3 .github/scripts/fetch_brasileirao.py || true
          python3 .github/scripts/fetch_voos.py || true

      - name: Commit and push if changed
        run: |
          git config --global user.name "Brasileirao Auto-Updater"
          git config --global user.email "brasileirao-updater@github.com"
          git add brasileirao_data.json voos_data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update brasileirao and sitaer data"
            git pull --rebase origin main || true
            git push
          fi
